plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hadir.attendance'
    compileSdk 34

    defaultConfig {
        applicationId "com.hadir.attendance"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    signingConfigs {
        release {
            def propsFile = file("${rootDir}/keystore.properties")
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (file("${rootDir}/keystore.properties").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // FileProvider for sharing the generated report PDF.
    implementation 'androidx.core:core:1.13.1'
}
