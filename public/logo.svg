<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6AAEFF"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <style>
      @font-face {
        font-family: "RuqaaLogo";
        src: url(data:font/ttf;base64,) format("truetype");
      }
      @font-face {
        font-family: "HaderLogo";
        src: url(data:font/ttf;base64,) format("truetype");
      }
    </style>
  </defs>

  <!-- rounded-square app icon background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>

  <!-- brand wordmark: حاضر in Ruq'ah, hader transliteration below -->
  <text x="256" y="272" direction="rtl" text-anchor="middle"
        font-family="RuqaaLogo" font-size="180" fill="#FFFFFF">حاضر</text>
  <text x="263" y="368" text-anchor="middle"
        font-family="HaderLogo" font-size="46" letter-spacing="14"
        fill="#FFFFFF" opacity="0.9">hader</text>
</svg>
