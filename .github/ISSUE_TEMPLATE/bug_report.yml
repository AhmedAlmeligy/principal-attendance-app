name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Security issues must not be reported here** — follow [SECURITY.md](../blob/main/SECURITY.md) instead.

  - type: dropdown
    id: surface
    attributes:
      label: Where did you see the bug?
      description: Which surface is affected?
      options:
        - Website (browser)
        - Android APK
        - Both
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: App version (Android: Settings → عن التطبيق), or "latest site".
      placeholder: "1.3 / latest site"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS (if on Android)
      description: e.g. Samsung Galaxy A54, Android 14 / Chrome 129
      placeholder: Samsung Galaxy A54, Android 14

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps starting from a clean state if possible.
      placeholder: |
        1. Open the app
        2. Go to التقارير
        3. Tap تحميل
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots / console output
      description: Drag screenshots in here, or paste browser console errors.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md)
          required: true
