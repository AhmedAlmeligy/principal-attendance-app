version: 2
updates:
  # Keep application dependencies current (drives Dependabot security alerts).
  # This project uses Bun (bun.lock), whose ecosystem is "bun" — the npm
  # updater cannot read bun.lock. The project lives in a nested directory.
  - package-ecosystem: "bun"
    directory: "/principal-attendance-app-main"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  # Keep GitHub Actions (the Pages deploy workflow) current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
